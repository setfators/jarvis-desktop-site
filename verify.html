```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS — Проверка безопасности</title>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111d;
      color: #eaf4ff;
      font-family: Arial, sans-serif;
    }

    .card {
      padding: 35px;
      text-align: center;
      background: #101f30;
      border: 1px solid #24435f;
      border-radius: 18px;
      max-width: 420px;
      width: calc(100% - 50px);
    }

    h1 { color: #45b8ff; }
    p { color: #a9bed1; }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>J.A.R.V.I.S</h1>
    <p>Подтверди, что ты не робот, чтобы продолжить использование облачного ИИ.</p>

    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAFy9cy0nicdfSL59"
      data-callback="onVerified"
      data-error-callback="onError"
    ></div>

    <div id="status">Ожидание проверки...</div>
  </div>

  <script>
    async function onVerified(token) {
      const status = document.getElementById("status");
      status.textContent = "Проверяем доступ к JARVIS...";

      try {
        const params = new URLSearchParams(window.location.search);
        const callback = params.get("callback");
        const state = params.get("state");

        if (!callback || !state) {
          throw new Error("Не найдено подключение к приложению JARVIS");
        }

        const callbackUrl = new URL(callback);

        if (
          callbackUrl.protocol !== "http:" ||
          callbackUrl.hostname !== "127.0.0.1" ||
          callbackUrl.pathname !== "/callback"
        ) {
          throw new Error("Некорректный адрес приложения");
        }

        const response = await fetch(
          "https://jarvis-ai-worker.sg530507.workers.dev/verify",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success || !data.session) {
          throw new Error(data.error || "Проверка не пройдена");
        }

        status.textContent = "Передаём доступ приложению JARVIS...";

        const callbackResponse = await fetch(callbackUrl.toString(), {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            session: data.session,
            state: state
          })
        });

        const callbackData = await callbackResponse.json();

        if (!callbackResponse.ok || !callbackData.success) {
          throw new Error("Не удалось передать доступ приложению");
        }

        status.textContent =
          "Готово! JARVIS получил доступ к облачному ИИ. Можешь закрыть страницу.";

      } catch (error) {
        status.textContent =
          "Ошибка проверки или подключения. Попробуй ещё раз.";

        console.error("JARVIS verification error:", error);
      }
    }

    function onError() {
      document.getElementById("status").textContent =
        "Ошибка проверки. Попробуй обновить страницу.";
    }
  </script>
</body>
</html>
