
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS — Проверка безопасности</title>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111d;
      color: #eaf4ff;
      font-family: Arial, sans-serif;
    }

    .card {
      padding: 35px;
      text-align: center;
      background: #101f30;
      border: 1px solid #24435f;
      border-radius: 18px;
      max-width: 420px;
      width: calc(100% - 50px);
    }

    h1 { color: #45b8ff; }

    p { color: #a9bed1; }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>J.A.R.V.I.S</h1>
    <p>Подтверди, что ты не робот, чтобы продолжить использование облачного ИИ.</p>

    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAFy9cy0nicdfSL59"
      data-callback="onVerified"
      data-error-callback="onError"
    ></div>

    <div id="status">Ожидание проверки...</div>
  </div>

  <script>
    function onVerified(token) {
      document.getElementById("status").textContent =
        "Проверка пройдена. Подготавливаем JARVIS...";
      
      // Передачу токена приложению добавим следующим шагом.
      console.log("Turnstile verification completed");
    }

    function onError() {
      document.getElementById("status").textContent =
        "Ошибка проверки. Попробуй обновить страницу.";
    }
  </script>
</body>
</html>
